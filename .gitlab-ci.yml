# GitLab: бот запускается по расписанию (Build → Pipeline schedules) или кнопкой "Run pipeline".
# Ключи берутся из Settings → CI/CD → Variables: TELEGRAM_BOT_TOKEN, GEMINI_API_KEY.
# Память бота (state/) сохраняется обратно в репозиторий через CI_JOB_TOKEN
# (нужна галочка Settings → CI/CD → Job token permissions → "Allow Git push requests to the repository").

digest:
  image: python:3.12
  timeout: 30m
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  variables:
    GIT_DEPTH: "1"
    PYTHONIOENCODING: "utf-8"
  script:
    - set +e
    - python -u -m agent.main; status=$?
    - git config user.name "opportunity-agent"
    - git config user.email "bot@users.noreply.gitlab.com"
    - git add state/
    - |
      if ! git diff --cached --quiet; then
        git commit -q -m "state: ci run $(date -u +%Y-%m-%dT%H:%M)"
        git push -q "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:${CI_COMMIT_REF_NAME}" || echo "WARNING: could not save state"
      fi
    - exit $status
