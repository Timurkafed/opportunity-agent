# GitLab: бот запускается по расписанию (Build → Pipeline schedules) или кнопкой "Run pipeline".
# Ключи берутся из Settings → CI/CD → Variables: TELEGRAM_BOT_TOKEN, GEMINI_API_KEY.
# Память бота (state/) сохраняется обратно в репозиторий через CI_JOB_TOKEN (python -m agent.gitstate)
# (нужна галочка Settings → CI/CD → Job token permissions → "Allow Git push requests to the repository").

digest:
  image: python:3.12
  timeout: 30m
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  variables:
    GIT_DEPTH: "50"
    PYTHONIOENCODING: "utf-8"
    OPP_RUNNER: "gitlab"
  script:
    - set +e
    - git checkout -q -B main "$CI_COMMIT_SHA"
    - export STATE_REMOTE="https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - python -u -m agent.main; status=$?
    - 'python -m agent.gitstate gitlab || echo "WARNING - could not save state"'
    - exit $status
